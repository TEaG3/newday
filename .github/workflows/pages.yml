name: Website
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tests/site-opl-demo.test.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tests/site-opl-demo.test.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site and OPL browser simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all website JavaScript syntax
        run: |
          set -euo pipefail
          for file in site/*.js; do node --check "$file"; done
      - name: Test OPL simulator routing matrix
        run: node tests/site-opl-demo.test.cjs
      - name: Validate website links, pages and SVG diagrams
        run: python3 tools/check_site.py

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Archive site for GitHub Pages
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .
      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
