name: Website
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tests/site-opl-demo.test.cjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tests/site-opl-demo.test.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site and OPL browser simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check all website JavaScript syntax
        run: |
          set -euo pipefail
          for file in site/*.js; do node --check "$file"; done
      - name: Test OPL simulator routing matrix
        run: node tests/site-opl-demo.test.cjs
      - name: Validate website links, pages and SVG diagrams
        run: python3 tools/check_site.py

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Archive site for GitHub Pages
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude=".[^/]*" \
            .
      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          overwrite: true
      - name: Wait for GitHub Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false and .size_in_bytes > 0) | .id' | head -n 1)"
            if [ -n "$artifact_id" ]; then
              echo "GitHub Pages artifact metadata is visible (id=$artifact_id)."
              exit 0
            fi
            echo "GitHub Pages artifact not visible yet (attempt ${attempt}/12); retrying in 5 seconds."
            sleep 5
          done
          echo "::error::GitHub Pages artifact was uploaded but did not become visible in the Actions API within 60 seconds."
          exit 1
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
