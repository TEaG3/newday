name: Publish TEa.G3 PS2 release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New GitHub release tag"
        required: true
        default: "arabic-v1.3.2"
permissions:
  contents: write

jobs:
  opl-engine:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' && contains(github.event.workflow_run.head_commit.message, 'Merge pull request #15')) }}
    name: Build pinned OPL runtime
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Check out TEa.G3 source
        uses: actions/checkout@v4
        with:
          path: tea-g3

      - name: Check out pinned Open PS2 Loader
        uses: actions/checkout@v4
        with:
          repository: ps2homebrew/Open-PS2-Loader
          ref: b3a2199795fe89ba7e2dd7b843354472dff2c3eb
          path: Open-PS2-Loader

      - name: Fetch lwNBD dependency before cleaning
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Open-PS2-Loader"
          git fetch --prune --unshallow
          bash ./download_lwNBD.sh
          test -f modules/network/lwNBD/Makefile
          test "$(git -C modules/network/lwNBD rev-parse HEAD)" = "15f1c14536d662e2e00d38d0aa91ef24149e8b96"

      - name: Apply TEa.G3 USBExtreme UL direct-boot patch
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_ul.py" src/opl.c
          grep -Fq 'int isUL = !strcmp(argv[4], "ul")' src/opl.c
          grep -Fq 'GAME_FORMAT_USBLD' src/opl.c
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/opl.c").read_text(encoding="utf-8")
          assert "if (!isUL && gBDMPrefix[0] != '\\0') {" in source
          assert "if (!isUL && gBDMPrefix[0] != '\\\\0') {" not in source
          assert 'snprintf(gAutoLaunchBDMGame->startup, sizeof(gAutoLaunchBDMGame->startup), "%s", argv[2]);' in source
          PY

      - name: Clean and compile OPL ELF
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make NOT_PACKED=1
          test -s opl.elf
          cp opl.elf "$GITHUB_WORKSPACE/OPL.ELF"
          cp LICENSE "$GITHUB_WORKSPACE/OPL-LICENSE.txt"

      - name: Upload OPL runtime
        uses: actions/upload-artifact@v4
        with:
          name: tea-g3-opl-release-${{ github.sha }}
          path: |
            OPL.ELF
            OPL-LICENSE.txt
          if-no-files-found: error

  package-and-release:
    name: Build single ELF and publish Arabic package
    runs-on: ubuntu-latest
    needs: [opl-engine]
    steps:
      - name: Check out TEa.G3 source
        uses: actions/checkout@v4

      - name: Download pinned OPL runtime
        uses: actions/download-artifact@v4
        with:
          name: tea-g3-opl-release-${{ github.sha }}
          path: runtime-input

      - name: Fetch pinned upstream Neutrino MMCE FHI module
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          bash tools/fetch_neutrino_mmcefhi.sh

      - name: Build TEa.G3 with embedded OPL and Neutrino
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src ps2dev/ps2dev:latest sh -c '
            set -eu
            export PS2DEV="${PS2DEV:-/usr/local/ps2dev}"
            export PS2SDK="${PS2SDK:-$PS2DEV/ps2sdk}"
            export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
            apk add --no-cache python3 py3-pip make py3-pillow build-base openssl-dev libjpeg-turbo-dev libpng-dev bash git
            pip3 install --break-system-packages --no-cache-dir fonttools mapbox-earcut
            python3 -m py_compile tools/make_release.py tools/embed_runtime.py tools/package_single_elf_release.py tools/theme_check.py
            make test
            python3 tools/theme_check.py
            make clean
            bash tools/build_neutrino.sh
            mkdir -p runtime-input
            cp -R dist/neutrino runtime-input/neutrino
            test -s runtime-input/OPL.ELF
            cp runtime-input/OPL-LICENSE.txt OPL-LICENSE.txt
            python3 tools/embed_runtime.py runtime-input "$PS2SDK/bin/bin2c"
            make APP=launcher
            test -s TEa.G3.ELF
            test -s runtime-manifest.txt
            grep -q "^OPL.ELF" runtime-manifest.txt
            grep -q "^neutrino/neutrino.elf" runtime-manifest.txt
            grep -q "^neutrino/modules/mmcefhi.irx" runtime-manifest.txt
          '

      - name: Create validated single-ELF Arabic package
        run: python3 tools/package_single_elf_release.py "${{ inputs.release_tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'arabic-v1.3.2' }}
          name: "TEa.G3 PS2 — النسخة العربية"
          body: |
            النسخة العربية من TEa.G3، تعديل وتطوير المطور العراقي TEa.G3.

            - ملف تشغيل واحد للمستخدم: TEa.G3.ELF.
            - OPL وNeutrino ووحداتهما مضمّنة داخل الملف وتُجهّز تلقائياً على USB.
            - العربية هي اللغة الافتراضية مع دعم تغيير اللغة والمظاهر من الإعدادات.
            - ISO/ZSO يستخدم Neutrino تلقائياً؛ وUSBExtreme UL يستخدم OPL.
            - يتضمن الأرشيف INSTALL-AR.txt وتراخيص المحركات وبصمات SHA-256.

            This release remains a prerelease until PCSX2 and real PS2 hardware smoke tests are completed.
          prerelease: true
          files: |
            dist/TEa.G3-PS2.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
