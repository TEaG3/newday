name: Publish TEa.G3 PS2 release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New GitHub release tag"
        required: true
  push:
    branches:
      - "arabic-v*"
    tags:
      - "arabic-v*"
    paths-ignore:
      - "site/**"
      - "tests/**"
      - "docs/**"
      - ".github/workflows/build-ps2.yml"
      - ".github/workflows/pages.yml"
      - ".github/workflows/publish-arabic-release.yml"

permissions:
  contents: write

jobs:
  opl-engine:
    name: Build pinned OPL runtime
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Check out TEa.G3 source
        uses: actions/checkout@v4
        with:
          path: tea-g3

      - name: Check out the same pinned TEaG3/OPL source used by CI
        uses: actions/checkout@v4
        with:
          repository: TEaG3/OPL
          ref: 46bad5a4a469c51e45eb1ed879fe43c100b8cb7b
          path: Open-PS2-Loader

      - name: Fetch lwNBD dependency before cleaning
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Open-PS2-Loader"
          git fetch --prune --unshallow
          bash ./download_lwNBD.sh
          test -f modules/network/lwNBD/Makefile
          test "$(git -C modules/network/lwNBD rev-parse HEAD)" = "15f1c14536d662e2e00d38d0aa91ef24149e8b96"

      - name: Apply TEa.G3 USBExtreme direct-boot patch
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_ul.py" "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_eth.py" "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_hdl.py"
          python3 "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_ul.py" src/opl.c
          python3 "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_eth.py" src/opl.c src/ethsupport.c
          python3 "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_hdl.py" src/opl.c src/hddsupport.c include/hddsupport.h
          grep -Fq 'if (!strcmp(argv[4], "eth") && argc >= 14)' src/opl.c
          grep -Fq 'int ethAutoLaunchGame(char *argv[])' src/ethsupport.c
          grep -Fq 'if (ethDirectLaunch)' src/ethsupport.c
          grep -Fq 'int isUL = !strcmp(argv[4], "ul")' src/opl.c
          grep -Fq 'int isBDM = !strcmp(argv[4], "bdm")' src/opl.c
          grep -Fq 'gAutoLaunchDeviceData->bdmDeviceType = BDM_TYPE_SDC' src/opl.c
          grep -Fq 'gAutoLaunchDeviceData->massDeviceIndex == wantedUnit' src/opl.c
          grep -Fq 'TEa.G3 BDM auto-launch: requested device not found' src/opl.c
          grep -Fq 'GAME_FORMAT_USBLD' src/opl.c
          grep -Fq 'gTEaG3HDDMiniReady = 1' src/hddsupport.c
          grep -Fq 'FIO_MT_RDONLY' src/hddsupport.c
          grep -Fq 'TEa.G3 HDL mini-launch refused' src/opl.c
          grep -Fq 'gAutoLaunchGame->total_size_in_kb = (u32)size_kb' src/opl.c
          grep -Fq 'gAutoLaunchGame->disctype = (u8)disc_type' src/opl.c
          grep -Fq 'argc >= 6 && !strcmp(argv[5], "mini")' src/opl.c
          grep -Fq 'argv[6] = "mini"' "$GITHUB_WORKSPACE/tea-g3/launcher.c"
          grep -Fq 'argv[5] = disc_type' "$GITHUB_WORKSPACE/tea-g3/launcher.c"
          grep -Fq 'run_loader_recover(8, opl_argv)' "$GITHUB_WORKSPACE/tea-g3/launcher.c"
          grep -Fq 'run_loader_recover(15, opl_argv)' "$GITHUB_WORKSPACE/tea-g3/launcher.c"
          grep -Fq 'run_loader_recover(9, opl_argv)' "$GITHUB_WORKSPACE/tea-g3/launcher.c"
          grep -Fq 'gExitPath, sizeof(gExitPath), "%s", argv[6]' "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_hdl.py"
          grep -Fq 'gExitPath, sizeof(gExitPath), "%s", argv[13]' "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_eth.py"
          grep -Fq 'gExitPath, sizeof(gExitPath), "%s", argv[6]' "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_ul.py"
          grep -Fq 'if (!strcmp(argv[4], "ul") && argv[6] && argv[6][0])' "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_ul.py"
          grep -Fq 'else if (!strcmp(argv[4], "bdm") && argv[7] && argv[7][0])' "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_ul.py"
          grep -Fq 'return 0;' src/opl.c
          grep -Fq "if (!isUL && gBDMPrefix[0] != '\\0') {" src/opl.c
          if grep -Fq "if (!isUL && gBDMPrefix[0] != '\\\\0') {" src/opl.c; then
            echo "Unexpected double-escaped C null character in OPL prefix guard"
            exit 1
          fi
          grep -Fq 'snprintf(gAutoLaunchBDMGame->startup, sizeof(gAutoLaunchBDMGame->startup), "%s", argv[2]);' src/opl.c

      - name: Clean and compile OPL ELF
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          make clean
          test -s include/lang_autogen.h
          test -s src/lang_internal.c
          make NOT_PACKED=1 RTL=1 PADEMU=1
          test -s opl.elf
          cp opl.elf "$GITHUB_WORKSPACE/OPL.ELF"
          cp LICENSE "$GITHUB_WORKSPACE/OPL-LICENSE.txt"

      - name: Upload OPL runtime
        uses: actions/upload-artifact@v4
        with:
          name: tea-g3-opl-release-${{ github.sha }}
          path: |
            OPL.ELF
            OPL-LICENSE.txt
          if-no-files-found: error

  package-and-release:
    name: Build single ELF and publish Arabic package
    runs-on: ubuntu-latest
    needs: [opl-engine]
    steps:
      - name: Check out TEa.G3 source
        uses: actions/checkout@v4

      - name: Download pinned OPL runtime
        uses: actions/download-artifact@v4
        with:
          name: tea-g3-opl-release-${{ github.sha }}
          path: runtime-input

      - name: Build TEa.G3 with embedded OPL and SMB support modules
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/src" -w /src ps2dev/ps2dev:latest sh -c '
            set -eu
            export PS2DEV="${PS2DEV:-/usr/local/ps2dev}"
            export PS2SDK="${PS2SDK:-$PS2DEV/ps2sdk}"
            export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
            apk add --no-cache python3 py3-pip make py3-pillow build-base openssl-dev libjpeg-turbo-dev libpng-dev bash git
            pip3 install --break-system-packages --no-cache-dir fonttools mapbox-earcut
            python3 -m py_compile tools/make_release.py tools/embed_runtime.py tools/package_single_elf_release.py tools/theme_check.py tools/patch_smb_ioman.py
            make test
            python3 tools/theme_check.py
            make clean
            bash tools/build_smb_support.sh
            mkdir -p runtime-input
            cp -R dist/network runtime-input/network
            test -s runtime-input/OPL.ELF
            test -s runtime-input/OPL-LICENSE.txt
            test -s runtime-input/network/modules/smap.irx
            test -s runtime-input/network/modules/ministack.irx
            test -s runtime-input/network/modules/smb_ioman.irx
            test -s runtime-input/network/SMB-LICENSE.txt
            cp runtime-input/OPL-LICENSE.txt OPL-LICENSE.txt
            python3 tools/embed_runtime.py runtime-input "$PS2SDK/bin/bin2c"
            make APP=launcher
            test -s TEa.G3.ELF
            test -s runtime-manifest.txt
            grep -q "^OPL.ELF" runtime-manifest.txt
            grep -q "^network/modules/smap.irx" runtime-manifest.txt
            grep -q "^network/modules/ministack.irx" runtime-manifest.txt
            grep -q "^network/modules/smb_ioman.irx" runtime-manifest.txt
            ! grep -qi "neutrino/neutrino.elf" runtime-manifest.txt
          '

      - name: Restore workspace ownership after the Docker build
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Create validated single-ELF Arabic package
        run: python3 tools/package_single_elf_release.py "${{ github.event.inputs.release_tag || github.ref_name }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "TEa.G3 PS2 — النسخة العربية"
          body: |
            النسخة العربية من TEa.G3، تعديل وتطوير المطور العراقي TEa.G3.

            - ملف تشغيل واحد للمستخدم: TEa.G3.ELF.
            - OPL هو محرك ألعاب PS2 الوحيد؛ لا يوجد Neutrino ELF ولا رجوع إلى Neutrino.
            - مسارات التشغيل المدمجة: USB/BDM عبر OPL BDM، وUSBExtreme UL عبر OPL UL، وSMB عبر OPL ETH، وAPA/HDL ISO عبر OPL HDD.
            - وحدات SMB IOP المساعدة مضمّنة لفهرسة TEAG3.GAMES فقط؛ OPL ETH يتولى قراءة بيانات اللعبة.
            - العربية هي اللغة الافتراضية مع دعم تغيير اللغة والمظاهر من الإعدادات.
            - ZSO عبر BDM وETH؛ لا يدعم مسار APA/HDL mini صيغة ZSO.
            - يتضمن الأرشيف INSTALL-AR.txt وتراخيص OPL ووحدات SMB وبصمات SHA-256.
            - تم تضمين CRC-32 لكل ملف runtime والتحقق منه بعد الاستخراج.

            This release remains a prerelease until PCSX2 and real PS2 hardware smoke tests are completed.
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            dist/TEa.G3-Complete-Package.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
