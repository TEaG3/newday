name: PS2 launcher build

on:
  push:
    branches:
      - master
      - feature/tea-g3-rebrand
      - feature/single-entrypoint-runtime
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-zso-tests:
    name: ZSO host decoder fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run bounded ZSO decoder and scanner fixtures
        run: |
          set -euo pipefail
          python3 -m py_compile tools/make_release.py tools/embed_runtime.py tools/theme_check.py
          cc -std=c99 -Wall -Wextra -Wno-unused-parameter -include string.h \
            -Itests/zso_host -Ithird_party/opl-zso \
            tests/zso_host/test_zso.c third_party/opl-zso/zso.c \
            third_party/opl-zso/lz4.c \
            -o /tmp/zso_host_test
          /tmp/zso_host_test
          cc -std=gnu99 -Wall -Wextra -Wno-unused-parameter \
            -Itests/zso_host/include -I. -Ithird_party/opl-zso \
            tests/zso_host/test_zso_ee.c zso_ee.c \
            -o /tmp/zso_ee_host_test
          /tmp/zso_ee_host_test
          python3 -m unittest tests/test_smb_catalog.py

  launcher:
    name: Embed OPL and Neutrino into the single launcher ELF
    needs: [opl-engine]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Fetch pinned upstream MMCE FHI module
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
          bash tools/fetch_neutrino_mmcefhi.sh

      - name: Download pinned OPL runtime
        uses: actions/download-artifact@v4
        with:
          name: tea-g3-opl-${{ github.sha }}
          path: runtime-input

      - name: Validate languages and compile the embedded runtime with PS2SDK
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            ps2dev/ps2dev:latest \
            sh -c '
              set -eu
              set -o pipefail
              export PS2DEV="${PS2DEV:-/usr/local/ps2dev}"
              export PS2SDK="${PS2SDK:-$PS2DEV/ps2sdk}"
              export PATH="$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH"
              apk add --no-cache python3 py3-pip make py3-pillow build-base openssl-dev libjpeg-turbo-dev libpng-dev bash git
              pip3 install --break-system-packages --no-cache-dir fonttools mapbox-earcut
              command -v mips64r5900el-ps2-elf-gcc
              test -x "$PS2DEV/ee/bin/mips64r5900el-ps2-elf-gcc"
              make test
              python3 tools/theme_check.py
              make clean
              bash tools/build_neutrino.sh 2>&1 | tee build.log
              mkdir -p runtime-input
              cp -R dist/neutrino runtime-input/neutrino
              test -s runtime-input/OPL.ELF
              cp runtime-input/OPL-LICENSE.txt OPL-LICENSE.txt
              python3 tools/embed_runtime.py runtime-input "$PS2SDK/bin/bin2c"
              { make APP=launcher; } 2>&1 | tee -a build.log
              test -s TEa.G3.ELF
              test -s runtime-manifest.txt
              grep -q '^OPL.ELF' runtime-manifest.txt
              grep -q '^neutrino/neutrino.elf' runtime-manifest.txt
              ls -lh TEa.G3.ELF runtime-manifest.txt
              test -s dist/neutrino/neutrino.elf
              test -s dist/neutrino/modules/ee_core.elf
              test -s dist/neutrino/modules/raagent.irx
              test -s dist/neutrino/modules/cdvdman_emu.irx
              test -s dist/neutrino/modules/smap.irx
              test -s dist/neutrino/modules/ministack.irx
              test -s dist/neutrino/modules/smb_ioman.irx
              test -s dist/neutrino/modules/smb_fhi.irx
              test -s dist/neutrino/modules/mmcefhi.irx
              test -s dist/neutrino/config/bsd-smb.toml
              ls -lh dist/neutrino/neutrino.elf dist/neutrino/modules/*.elf dist/neutrino/modules/*.irx
            '

      - name: Upload launcher ELF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tea-g3-launcher-${{ github.sha }}
          path: |
            TEa.G3.ELF
            runtime-manifest.txt
            OPL-LICENSE.txt
          if-no-files-found: error

      - name: Upload Neutrino Arabic IGR build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tea-g3-neutrino-${{ github.sha }}
          path: dist/neutrino/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tea-g3-build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: warn

  opl-engine:
    name: Build upstream OPL runtime (pinned source)
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main
    steps:
      - name: Check out TEa.G3 integration branch
        uses: actions/checkout@v4
        with:
          path: tea-g3

      - name: Check out Open PS2 Loader at pinned revision
        uses: actions/checkout@v4
        with:
          repository: ps2homebrew/Open-PS2-Loader
          ref: b3a2199795fe89ba7e2dd7b843354472dff2c3eb
          path: Open-PS2-Loader

      - name: Fetch lwNBD dependency before cleaning
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE/Open-PS2-Loader"
          git fetch --prune --unshallow
          bash ./download_lwNBD.sh
          test -f modules/network/lwNBD/Makefile
          test "$(git -C modules/network/lwNBD rev-parse HEAD)" = "15f1c14536d662e2e00d38d0aa91ef24149e8b96"

      - name: Apply TEa.G3 USBExtreme direct-boot patch
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tea-g3/tools/patch_opl_ul.py" src/opl.c
          grep -Fq 'int isUL = !strcmp(argv[4], "ul")' src/opl.c
          grep -Fq 'GAME_FORMAT_USBLD' src/opl.c
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/opl.c").read_text(encoding="utf-8")
          assert "if (!isUL && gBDMPrefix[0] != '\\0') {" in source
          assert "if (!isUL && gBDMPrefix[0] != '\\\\0') {" not in source
          assert 'snprintf(gAutoLaunchBDMGame->startup, sizeof(gAutoLaunchBDMGame->startup), "%s", argv[2]);' in source
          PY

      - name: Clean and compile OPL ELF
        working-directory: Open-PS2-Loader
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make NOT_PACKED=1
          test -s opl.elf
          cp opl.elf "$GITHUB_WORKSPACE/OPL.ELF"
          cp LICENSE "$GITHUB_WORKSPACE/OPL-LICENSE.txt"
          file "$GITHUB_WORKSPACE/OPL.ELF" || true
          sha256sum "$GITHUB_WORKSPACE/OPL.ELF"

      - name: Upload standalone OPL runtime
        uses: actions/upload-artifact@v4
        with:
          name: tea-g3-opl-${{ github.sha }}
          path: |
            OPL.ELF
            OPL-LICENSE.txt
          if-no-files-found: error

  test-bundle:
    name: Assemble unified TEa.G3 runtime test bundle
    runs-on: ubuntu-latest
    needs: [host-zso-tests, launcher, opl-engine]
    steps:
      - name: Check out integration docs
        uses: actions/checkout@v4

      - name: Download launcher ELF
        uses: actions/download-artifact@v4
        with:
          name: tea-g3-launcher-${{ github.sha }}
          path: bundle

      - name: Download Neutrino runtime and modules
        uses: actions/download-artifact@v4
        with:
          name: tea-g3-neutrino-${{ github.sha }}
          path: bundle/neutrino

      - name: Download OPL runtime
        uses: actions/download-artifact@v4
        with:
          name: tea-g3-opl-${{ github.sha }}
          path: bundle

      - name: Verify and add integration test instructions
        shell: bash
        run: |
          set -euo pipefail
          test -s bundle/TEa.G3.ELF
          test -s bundle/OPL.ELF
          test -s bundle/neutrino/neutrino.elf
          test -s bundle/neutrino/modules/cdvdman_emu.irx
          test -s bundle/neutrino/modules/smb_fhi.irx
          test -s bundle/neutrino/modules/mmcefhi.irx
          mkdir -p bundle/docs
          cp docs/game-formats.md docs/opl-engine-integration.md docs/smb.md bundle/docs/
          cp tests/PCSX2_SMOKE_TEST.md bundle/PCSX2_SMOKE_TEST.md
          cat > bundle/README-TEST-BUNDLE.txt <<'EOF'
          TEa.G3 embedded-runtime integration test bundle

          User installation:
          - Copy TEa.G3.ELF only; OPL and Neutrino plus their modules are embedded
            and extracted automatically to tea_g3/runtime/ on first boot.

          Diagnostic files:
          - OPL.ELF and neutrino/: standalone CI build outputs for inspection only.

          For USBExtreme tests, keep ul.cfg and every ul.* part in the USB root.
          Follow PCSX2_SMOKE_TEST.md before reporting runtime compatibility.
          A successful CI build does not prove gameplay.
          EOF

      - name: Upload unified integration test bundle
        uses: actions/upload-artifact@v4
        with:
          name: tea-g3-integration-test-bundle-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 30
