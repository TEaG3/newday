<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">TEa.G3 OPL-only game routing</title>
<desc id="desc">The TEa.G3 launcher validates a source and hands supported formats to one embedded OPL runtime. USB ISO and ZSO use OPL BDM, USBExtreme UL uses OPL UL, HD Loader ISO uses OPL HDD mini-launch. Unsupported network and MMCE game sources fail closed.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#C8FF2E"/></marker></defs>
<rect width="1280" height="720" fill="#080A0E"/>
<text x="72" y="82" fill="#C8FF2E" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">TEa.G3 / RUNTIME ARCHITECTURE</text>
<text x="72" y="140" fill="#F4F5F7" font-family="Arial,sans-serif" font-size="44" font-weight="700">One PS2 game engine: OPL</text>
<g font-family="Arial,sans-serif">
<rect x="72" y="220" width="280" height="160" rx="18" fill="#171C24" stroke="#59616D" stroke-width="2"/>
<text x="212" y="272" text-anchor="middle" fill="#F4F5F7" font-size="30" font-weight="700">TEa.G3</text>
<text x="212" y="316" text-anchor="middle" fill="#AEB7C3" font-size="20">Arabic front end</text>
<text x="212" y="348" text-anchor="middle" fill="#AEB7C3" font-size="20">scan · validate · hand-off</text>
<path d="M352 300 H440" stroke="#C8FF2E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="458" y="220" width="300" height="160" rx="18" fill="#171C24" stroke="#59616D" stroke-width="2"/>
<text x="608" y="272" text-anchor="middle" fill="#F4F5F7" font-size="28" font-weight="700">Source adapter</text>
<text x="608" y="316" text-anchor="middle" fill="#AEB7C3" font-size="20">format + device + unit</text>
<text x="608" y="348" text-anchor="middle" fill="#AEB7C3" font-size="20">image and metadata checks</text>
<path d="M758 300 H830" stroke="#C8FF2E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="848" y="200" width="360" height="200" rx="18" fill="#1D2A18" stroke="#C8FF2E" stroke-width="3"/>
<text x="1028" y="255" text-anchor="middle" fill="#C8FF2E" font-size="36" font-weight="700">OPL.ELF</text>
<text x="1028" y="300" text-anchor="middle" fill="#F4F5F7" font-size="23">only PS2 game engine</text>
<text x="1028" y="342" text-anchor="middle" fill="#AEB7C3" font-size="19">owns game-sector reads</text>
<text x="1028" y="372" text-anchor="middle" fill="#AEB7C3" font-size="18">embedded in TEa.G3.ELF</text>
<path d="M1028 400 V460 H245 V500" fill="none" stroke="#C8FF2E" stroke-width="3"/>
<path d="M1028 460 H640 V500" fill="none" stroke="#C8FF2E" stroke-width="3"/>
<path d="M1028 460 H1035 V500" fill="none" stroke="#C8FF2E" stroke-width="3"/>
<rect x="72" y="500" width="346" height="132" rx="16" fill="#151D28" stroke="#6C91B9" stroke-width="2"/>
<text x="245" y="548" text-anchor="middle" fill="#F4F5F7" font-size="25" font-weight="700">OPL BDM</text>
<text x="245" y="586" text-anchor="middle" fill="#AEB7C3" font-size="19">USB ISO/ZSO · ATA · MX4SIO · iLink</text>
<rect x="467" y="500" width="346" height="132" rx="16" fill="#151D28" stroke="#6C91B9" stroke-width="2"/>
<text x="640" y="548" text-anchor="middle" fill="#F4F5F7" font-size="25" font-weight="700">OPL UL</text>
<text x="640" y="586" text-anchor="middle" fill="#AEB7C3" font-size="19">USBExtreme split-part images</text>
<rect x="862" y="500" width="346" height="132" rx="16" fill="#151D28" stroke="#6C91B9" stroke-width="2"/>
<text x="1035" y="548" text-anchor="middle" fill="#F4F5F7" font-size="25" font-weight="700">OPL HDD</text>
<text x="1035" y="586" text-anchor="middle" fill="#AEB7C3" font-size="19">APA / HD Loader ISO mini-launch</text>
<text x="72" y="674" fill="#F0A35A" font-size="18">SMB · UDPBD · UDPFS game streaming · MMCE game source: disabled / fail closed</text>
</g>
</svg>
