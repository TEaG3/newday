<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">TEa.G3 embedded runtime architecture</title>
<desc id="desc">One TEa.G3 ELF contains the OPL and Neutrino runtimes. TEa.G3 selects a launch path: USBExtreme UL goes to OPL, USB ISO or ZSO can use OPL when motor equals opl, and the normal auto ISO or ZSO route remains Neutrino.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#05070b"/></linearGradient>
 <linearGradient id="acid" x2="1"><stop stop-color="#c8ff2e"/><stop offset="1" stop-color="#8edb2b"/></linearGradient>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8d9aaa"/></marker>
 <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c8ff2e"/></marker>
 <style>.t{font-family:Arial,sans-serif;fill:#e8edf4}.muted{font-family:Arial,sans-serif;fill:#9ba8b8}.mono{font-family:monospace;fill:#c8ff2e}.card{fill:#111a27;stroke:#364253;stroke-width:2}.green{fill:#101e12;stroke:#c8ff2e;stroke-width:2}.blue{fill:#101b2a;stroke:#69b6ff;stroke-width:2}.line{fill:none;stroke:#8d9aaa;stroke-width:4;marker-end:url(#arrow)}.gline{fill:none;stroke:#c8ff2e;stroke-width:4;marker-end:url(#greenArrow)}</style>
</defs>
<rect width="1440" height="900" fill="url(#bg)"/>
<text x="72" y="76" class="mono" font-size="20">TEa.G3 / RUNTIME MAP</text>
<text x="72" y="132" class="t" font-size="48" font-weight="700">One launcher. Two embedded engines.</text>
<text x="72" y="174" class="muted" font-size="22">The route is selected by format, source and [juegos] motor preference.</text>
<rect x="72" y="230" width="1296" height="142" rx="18" class="green"/>
<text x="116" y="286" class="mono" font-size="24">USER FILE</text>
<text x="116" y="332" class="t" font-size="42" font-weight="700">TEa.G3.ELF</text>
<text x="510" y="290" class="t" font-size="25">Contains the launcher + OPL.ELF + Neutrino + required modules</text>
<text x="510" y="330" class="muted" font-size="20">First boot installs and CRC-checks the embedded runtime under tea_g3/runtime/.</text>
<path d="M720 372V430" class="gline"/>
<rect x="390" y="430" width="660" height="118" rx="16" class="card"/>
<text x="720" y="478" class="t" font-size="30" text-anchor="middle" font-weight="700">TEa.G3 engine_select()</text>
<text x="720" y="515" class="muted" font-size="20" text-anchor="middle">USB? · ISO / ZSO / UL? · auto / neutrino / opl?</text>
<path d="M720 548V592H355V636" class="gline"/><path d="M720 592H1085V636" class="line"/>
<rect x="72" y="636" width="566" height="166" rx="18" class="green"/>
<text x="116" y="690" class="mono" font-size="23">OPL ROUTES</text>
<text x="116" y="738" class="t" font-size="33" font-weight="700">Embedded OPL</text>
<text x="116" y="778" class="muted" font-size="19">USBExtreme UL automatically · USB ISO/ZSO when motor=opl</text>
<rect x="802" y="636" width="566" height="166" rx="18" class="blue"/>
<text x="846" y="690" fill="#69b6ff" font-size="23" font-family="monospace">DEFAULT / EXISTING ROUTES</text>
<text x="846" y="738" class="t" font-size="33" font-weight="700">Neutrino</text>
<text x="846" y="778" class="muted" font-size="19">Auto ISO/ZSO · explicit neutrino · existing non-USB paths</text>
<text x="72" y="856" class="muted" font-size="17">Boundary: the diagram describes TEa.G3's current adapters, not every upstream OPL backend.</text>
</svg>