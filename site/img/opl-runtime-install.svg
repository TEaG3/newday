<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">TEa.G3 single OPL runtime installation</title>
<desc id="desc">OPL.ELF is embedded in the TEa.G3 executable. On first boot the launcher extracts it to tea_g3/runtime, validates its CRC and then hands off to OPL. Later boots verify the installed runtime before use.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#C8FF2E"/></marker></defs>
<rect width="1280" height="720" fill="#080A0E"/>
<text x="72" y="82" fill="#C8FF2E" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">TEa.G3 / FIRST BOOT</text>
<text x="72" y="140" fill="#F4F5F7" font-family="Arial,sans-serif" font-size="44" font-weight="700">One executable. One embedded OPL runtime.</text>
<g font-family="Arial,sans-serif">
<rect x="72" y="230" width="300" height="190" rx="18" fill="#171C24" stroke="#59616D" stroke-width="2"/>
<text x="222" y="290" text-anchor="middle" fill="#F4F5F7" font-size="30" font-weight="700">TEa.G3.ELF</text>
<text x="222" y="338" text-anchor="middle" fill="#C8FF2E" font-size="23">contains OPL.ELF</text>
<text x="222" y="376" text-anchor="middle" fill="#AEB7C3" font-size="18">single user entry point</text>
<path d="M372 325 H445" stroke="#C8FF2E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="465" y="230" width="300" height="190" rx="18" fill="#171C24" stroke="#59616D" stroke-width="2"/>
<text x="615" y="290" text-anchor="middle" fill="#F4F5F7" font-size="28" font-weight="700">First boot</text>
<text x="615" y="338" text-anchor="middle" fill="#AEB7C3" font-size="20">extract to USB storage</text>
<text x="615" y="376" text-anchor="middle" fill="#AEB7C3" font-size="18">tea_g3/runtime/OPL.ELF</text>
<path d="M765 325 H838" stroke="#C8FF2E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="858" y="230" width="350" height="190" rx="18" fill="#1D2A18" stroke="#C8FF2E" stroke-width="3"/>
<text x="1033" y="290" text-anchor="middle" fill="#C8FF2E" font-size="30" font-weight="700">CRC-32 check</text>
<text x="1033" y="338" text-anchor="middle" fill="#F4F5F7" font-size="20">verify extracted OPL.ELF</text>
<text x="1033" y="376" text-anchor="middle" fill="#AEB7C3" font-size="18">fail closed if invalid</text>
<path d="M1033 420 V500" stroke="#C8FF2E" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="690" y="520" width="518" height="120" rx="18" fill="#151D28" stroke="#6C91B9" stroke-width="2"/>
<text x="949" y="568" text-anchor="middle" fill="#F4F5F7" font-size="27" font-weight="700">Launch OPL</text>
<text x="949" y="608" text-anchor="middle" fill="#AEB7C3" font-size="19">OPL reopens the selected device and reads game sectors</text>
<path d="M465 585 H372" stroke="#C8FF2E" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="72" y="520" width="300" height="120" rx="18" fill="#171C24" stroke="#59616D" stroke-width="2"/>
<text x="222" y="568" text-anchor="middle" fill="#F4F5F7" font-size="24" font-weight="700">Later boots</text>
<text x="222" y="608" text-anchor="middle" fill="#AEB7C3" font-size="18">verify marker and file; skip reinstall</text>
</g>
</svg>
